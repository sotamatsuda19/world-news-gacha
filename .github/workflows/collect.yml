# Daily news collection. Runs `npm run collect` on a GitHub-hosted Linux machine and
# saves the articles to Vercel Blob, where the site reads them.
#
# Secrets (repository Settings → Secrets and variables → Actions → Secrets):
#   ANTHROPIC_API_KEY       scoring and placing articles with Claude
#   BLOB_READ_WRITE_TOKEN   writing articles.json / health.json to Vercel Blob
#
# Note: logs of a public repository are public. The collector prints only outlet
# names and counts; secrets are masked as *** automatically.

name: collect

on:
  schedule:
    # Once a day at 10:17 UTC (05:17 in New York in winter, 19:17 in Tokyo).
    # Not on the hour: GitHub is busiest then and runs may start late or be dropped.
    - cron: "17 10 * * *"
  # Adds a "Run workflow" button on the Actions tab, for running it by hand.
  workflow_dispatch:

# Never run two collections at once (e.g. a manual run during the scheduled one).
concurrency:
  group: collect
  cancel-in-progress: false

# The job only needs to read the code.
permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run collect
        env:
          NEWS_STORE: cloud
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
