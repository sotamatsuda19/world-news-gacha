<!doctype html>
<!--
  The share image (1200×630): an airmail envelope flying out of a golden light on the
  Earth. Rendered by make-og.mjs with headless Chrome; the Earth is drawn by the app's
  own src/lib/earth-gl.ts (bundled next to this file as earth-gl.js).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --paper: #f6f1e6;
        --paper-edge: #e6dcc8;
        --airmail-red: #c8423b;
        --airmail-blue: #2c4f9e;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #02030a;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
      }
      /* The app's envelope (globals.css), at a fixed size. */
      .envelope {
        position: absolute;
        left: 812px;
        top: 150px;
        width: 300px;
        height: 188px;
        transform: rotate(-9deg);
        filter: drop-shadow(0 0 34px rgba(255, 214, 140, 0.55)) drop-shadow(0 18px 30px rgba(0, 0, 0, 0.6));
      }
      .envelope > span {
        position: absolute;
        inset: 0;
        border-radius: 6px;
      }
      .back {
        background: #e8ddc8;
      }
      .front {
        background: var(--paper);
        clip-path: polygon(0 34%, 50% 70%, 100% 34%, 100% 100%, 0 100%);
      }
      .flap {
        background: linear-gradient(180deg, #efe7d6, var(--paper));
        clip-path: polygon(0 0, 100% 0, 50% 62%);
      }
      .envelope::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 6px;
        border: 8px solid transparent;
        border-image: repeating-linear-gradient(
            135deg,
            var(--airmail-red) 0 12px,
            transparent 12px 18px,
            var(--airmail-blue) 18px 30px,
            transparent 30px 36px
          )
          8;
      }
      .stamp {
        inset: 12% 6% auto auto !important;
        width: 17%;
        aspect-ratio: 0.83;
        display: grid;
        place-items: center;
        color: var(--airmail-blue);
        background: #fbf7ee;
        border-radius: 2px !important;
        outline: 2px dotted #fbf7ee;
        outline-offset: 2px;
        box-shadow: 0 0 0 1px rgba(44, 79, 158, 0.35);
      }
      .stamp svg {
        width: 82%;
      }
      .postmark {
        inset: 15% 21% auto auto !important;
        width: 26%;
        height: 16%;
        border-radius: 0 !important;
        opacity: 0.45;
        background: repeating-linear-gradient(180deg, transparent 0 5px, rgba(35, 32, 27, 0.55) 5px 6.5px);
        -webkit-mask: radial-gradient(ellipse at 40% 50%, #000 40%, transparent 72%);
        transform: rotate(-8deg);
      }
      .name {
        position: absolute;
        right: 72px;
        bottom: 66px;
        margin: 0;
        font-family: "Hiragino Mincho ProN", "Noto Serif", Georgia, serif;
        font-size: 58px;
        font-weight: 400;
        letter-spacing: 0.04em;
        color: rgba(246, 241, 230, 0.95);
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="envelope">
      <span class="back"></span>
      <span class="front"></span>
      <span class="flap"></span>
      <span class="stamp">
        <svg viewBox="0 0 40 48">
          <circle cx="20" cy="20" r="11" fill="none" stroke="currentColor" stroke-width="1.4" />
          <ellipse cx="20" cy="20" rx="5" ry="11" fill="none" stroke="currentColor" stroke-width="1" />
          <line x1="9" y1="20" x2="31" y2="20" stroke="currentColor" stroke-width="1" />
          <text x="20" y="42" text-anchor="middle" font-size="6.5" fill="currentColor" letter-spacing="0.6">AIR MAIL</text>
        </svg>
      </span>
      <span class="postmark"></span>
    </div>
    <p class="name">NewsGacha</p>

    <script src="earth-gl.js"></script>
    <script>
      const W = 1200,
        H = 630,
        S = 2; // drawn at twice the size, shown at 1×: smoother edges
      const D = Math.PI / 180;
      const canvas = document.getElementById("c");
      canvas.width = W * S;
      canvas.height = H * S;
      const g = canvas.getContext("2d");
      g.scale(S, S);

      // The Earth: Africa and Europe facing us, lit from the right (where the envelope is).
      const E = { x: 330, y: 404, r: 300, lon: 22, tilt: 18 };
      const SUN = { lat: 12, lng: 62 };
      // Where a light on the Earth is on screen (orthographic, like the shader), or null if behind.
      function project(lat, lng) {
        const p = lat * D,
          l = (lng - E.lon) * D,
          t = E.tilt * D;
        const front = Math.sin(t) * Math.sin(p) + Math.cos(t) * Math.cos(p) * Math.cos(l);
        if (front < 0.12) return null;
        const x = Math.cos(p) * Math.sin(l);
        const y = Math.cos(t) * Math.sin(p) - Math.sin(t) * Math.cos(p) * Math.cos(l);
        return { x: E.x + x * E.r, y: E.y - y * E.r, front };
      }

      // Stars, the same every time (a fixed seed).
      let seed = 7;
      const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      g.fillStyle = "#02030a";
      g.fillRect(0, 0, W, H);
      for (let i = 0; i < 420; i++) {
        const x = rand() * W,
          y = rand() * H,
          r = 0.3 + rand() * 1.1,
          a = 0.15 + rand() * 0.5;
        g.fillStyle = `rgba(235,240,255,${a})`;
        g.beginPath();
        g.arc(x, y, r, 0, 7);
        g.fill();
      }

      const img = new Image();
      img.onload = () => {
        const earth = EarthGL.createEarthGL();
        earth.resize(W * S, H * S);
        earth.setTexture(img);

        // Atmosphere
        const atm = g.createRadialGradient(E.x, E.y, E.r * 0.985, E.x, E.y, E.r * 1.07);
        atm.addColorStop(0, "rgba(90,150,255,0.45)");
        atm.addColorStop(0.35, "rgba(70,120,255,0.12)");
        atm.addColorStop(1, "rgba(60,100,255,0)");
        g.fillStyle = atm;
        g.beginPath();
        g.arc(E.x, E.y, E.r * 1.07, 0, 7);
        g.fill();
        earth.draw(E.x * S, E.y * S, E.r * S, E.lon, E.tilt, SUN);
        g.drawImage(earth.canvas, 0, 0, W, H);

        // Faint lights in other places: the letters that could have come.
        const others = [
          [51.5, -0.1], [48.9, 2.4], [40.4, -3.7], [52.5, 13.4], [41.9, 12.5], [59.3, 18.1], [50.1, 14.4],
          [41, 29], [30, 31.2], [33.9, 35.5], [24.7, 46.7], [35.7, 51.4], [6.5, 3.4], [-1.3, 36.8],
          [9, 38.7], [14.7, -17.4], [-26.2, 28], [-33.9, 18.4], [5.6, -0.2], [12, 8.5], [55.8, 37.6],
          [50.4, 30.5], [60.2, 24.9], [36.8, 10.2], [-18.9, 47.5], [15.6, 32.5], [64.1, -21.9], [38.7, -9.1],
        ];
        for (const [lat, lng] of others) {
          const p = project(lat, lng);
          if (!p) continue;
          const glow = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, 7);
          glow.addColorStop(0, `rgba(255,226,170,${0.7 * p.front})`);
          glow.addColorStop(1, "rgba(255,214,140,0)");
          g.fillStyle = glow;
          g.beginPath();
          g.arc(p.x, p.y, 7, 0, 7);
          g.fill();
        }

        // The one that was drawn: a burst of light, and the trail of the envelope leaving it.
        const from = project(28.6, 77.2); // Delhi, near the edge on the right
        const to = { x: 846, y: 282 }; // just behind the envelope
        const ctl = { x: from.x + 150, y: from.y - 190 };
        const at = (t) => ({
          x: (1 - t) * (1 - t) * from.x + 2 * (1 - t) * t * ctl.x + t * t * to.x,
          y: (1 - t) * (1 - t) * from.y + 2 * (1 - t) * t * ctl.y + t * t * to.y,
        });
        const burst = g.createRadialGradient(from.x, from.y, 0, from.x, from.y, 120);
        burst.addColorStop(0, "rgba(255,246,220,0.95)");
        burst.addColorStop(0.16, "rgba(255,214,140,0.5)");
        burst.addColorStop(1, "rgba(255,214,140,0)");
        g.fillStyle = burst;
        g.beginPath();
        g.arc(from.x, from.y, 120, 0, 7);
        g.fill();
        // A ribbon of light, wider and brighter towards the envelope: a broad haze,
        // then a glow, then a bright core, added on top of each other like light.
        g.lineCap = "round";
        g.globalCompositeOperation = "lighter";
        for (const [width, alpha, color] of [
          [34, 0.035, "255,200,120"],
          [12, 0.09, "255,214,140"],
          [3, 0.4, "255,244,214"],
        ])
          for (let i = 0; i < 80; i++) {
            const a = at(i / 80),
              b = at((i + 1) / 80),
              k = i / 80;
            g.strokeStyle = `rgba(${color},${alpha * (0.25 + 0.75 * k)})`;
            g.lineWidth = width * (0.3 + 0.7 * k);
            g.beginPath();
            g.moveTo(a.x, a.y);
            g.lineTo(b.x, b.y);
            g.stroke();
          }
        g.globalCompositeOperation = "source-over";
        // and sparks along it
        for (let i = 0; i < 70; i++) {
          const k = rand(),
            p = at(k),
            off = (rand() - 0.5) * 26 * k,
            r = 0.6 + rand() * 1.8 * k;
          g.fillStyle = `rgba(255,240,205,${0.25 + 0.6 * k})`;
          g.beginPath();
          g.arc(p.x + off, p.y + off * 0.6, r, 0, 7);
          g.fill();
        }
        g.fillStyle = "#fff6df";
        g.shadowColor = "rgba(255,214,140,0.95)";
        g.shadowBlur = 18;
        g.beginPath();
        g.arc(from.x, from.y, 5, 0, 7);
        g.fill();
        g.shadowBlur = 0;

        earth.dispose();
        document.fonts.ready.then(() => (window.ready = true));
      };
      img.src = "earth-2k.jpg";
    </script>
  </body>
</html>
