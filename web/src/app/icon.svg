<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- NewsGacha: the app's own button, a glowing light in a ring, on the night sky. -->
  <defs>
    <radialGradient id="ring" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6df"/>
      <stop offset="0.55" stop-color="#ffd68c"/>
      <stop offset="1" stop-color="#ffd68c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#02030a"/>
  <circle cx="32" cy="32" r="22" fill="url(#ring)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="32" cy="32" r="13" fill="url(#core)"/>
</svg>
